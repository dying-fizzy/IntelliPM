
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliPM | Advanced AI Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* [ELEVATED LIGHT MODE] */
            --bg-primary: #F8FAFC; /* Off-Base Background */
            --bg-sidebar: #FFFFFF;
            --bg-header: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #000000; /* Pure Black */
            --text-body: #000000; 
            --border-color: rgba(0, 0, 0, 0.05);
            --border-sep: #E2E8F0;
            --accent: #00875A;
            --accent-blue: #0052CC;
            --accent-purple: #6554C0;
            --accent-pink: #D4075D;
            
            --elevation-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --sidebar-width: 260px;
            --header-height: 72px;
            --system-status-height: 4px;

            /* ── Liquid Glass Design System ── */
            --accent-rgb: 0, 135, 90;
            --glass-blur: 20px;
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .dark {
            /* [ELEVATED DARK MODE] */
            --bg-primary: #0A0A0A; /* True Deep Black Floor */
            --bg-sidebar: #1A1A1A; /* Slightly lighter surface for elevation */
            --bg-header: #1A1A1A;
            --bg-card: #1A1A1A; 
            --text-primary: #FFFFFF; /* Pure White */
            --text-body: #FFFFFF; 
            --border-color: rgba(255, 255, 255, 0.1); 
            --border-sep: #2D2D2D;
            --accent: #00FF00;
            --accent-blue: #00FFFF;
            --accent-purple: #BF00FF;
            --accent-pink: #FF007F;

            --elevation-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);

            /* ── Liquid Glass Design System (Dark) ── */
            --accent-rgb: 0, 255, 0;
            --glass-blur: 20px;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-body);
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }
        
        /* Typography Hierarchy Fix */
        h1, h2, h3, h4, h5, h6 { 
            color: var(--text-primary) !important; 
            font-weight: 700 !important; 
        }
        
        button {
            font-weight: 700 !important; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .blueprint-grid {
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 95%);
            opacity: 0.08;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .glass, .glass-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--elevation-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }
        
        .dark .neon-glow-green { filter: drop-shadow(0 0 8px var(--accent)); }
        .dark .neon-glow-blue { filter: drop-shadow(0 0 8px var(--accent-blue)); }

        .ui-label { 
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
            color: var(--text-primary) !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        :root:not(.dark) ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); }
        :root:not(.dark) ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }
        :root:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); }
        :root:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }

        .work-mode-active .dim-target {
            opacity: 0.05;
            filter: blur(10px) grayscale(100%);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* [ACCESIBILITY OVERRIDE] Force High Contrast Text */
        .opacity-30, .opacity-40, .opacity-50, .opacity-60, .opacity-70, .opacity-80 {
            opacity: 1 !important;
        }

        /* ── Native Select/Dropdown Fixes ── */
        select {
            background-color: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color);
        }
        select option {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
        }
        select option:hover,
        select option:checked {
            background-color: #2a2a2a;
            color: #00FF00;
        }
        /* Light mode option overrides */
        :root:not(.dark) select option {
            background-color: #ffffff;
            color: #0A0A0A;
        }
        :root:not(.dark) select option:hover,
        :root:not(.dark) select option:checked {
            background-color: #f0f0f0;
            color: #00875A;
        }

        /* ════════════════════════════════════════════════════════
           LIQUID GLASS DESIGN SYSTEM — Utility Classes
           Apple visionOS-inspired dark tinted glass over black.
           ════════════════════════════════════════════════════════ */

        /* ── Standard Glass Panel (cards, sections) ── */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        /* ── Elevated Glass Panel (modals, drawers, dropdowns) ──
             Uses a nearly-opaque background so scrolled content
             does NOT bleed through sticky headers.  The "glass"
             look is carried by the border highlights and inset
             glow, not by transparency.                          */
        .glass-panel-elevated {
            background: rgba(14, 14, 14, 0.97);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        /* ── Navigation Glass (sidebar, header/navbar) ── */
        .glass-nav {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
        }

        /* ── Glass Button (secondary / ghost style) ── */
        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        /* ── Glass Input (form fields, search bars) ── */
        .glass-input {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.15);
            outline: none;
        }

        /* ── Accent Glass (active / highlighted states) ── */
        .glass-accent {
            background: rgba(var(--accent-rgb), 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(var(--accent-rgb), 0.2);
            border-top: 1px solid rgba(var(--accent-rgb), 0.35);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(var(--accent-rgb), 0.2);
        }

        /* ── Modal Overlay ── */
        .glass-modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* ── Light Theme Glass Overrides ── */
        :root:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        :root:not(.dark) .glass-panel-elevated {
            background: rgba(250, 250, 252, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        :root:not(.dark) .glass-nav {
            background: rgba(245, 245, 245, 0.75);
            border-right: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.08);
        }

        :root:not(.dark) .glass-button {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
        }
        :root:not(.dark) .glass-button:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        :root:not(.dark) .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        :root:not(.dark) .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
        }

        :root:not(.dark) .glass-accent {
            background: rgba(var(--accent-rgb), 0.06);
            border: 1px solid rgba(var(--accent-rgb), 0.15);
            border-top: 1px solid rgba(var(--accent-rgb), 0.25);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(var(--accent-rgb), 0.15);
        }

        :root:not(.dark) .glass-modal-overlay {
            background: rgba(0, 0, 0, 0.3);
        }

    </style>

</head>
<body class="transition-colors duration-200 overflow-x-hidden">
    <div class="blueprint-grid"></div>

</body>
